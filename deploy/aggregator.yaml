apiVersion: v1
kind: Namespace
metadata:
  name: flowcartographer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowcartographer-aggregator
  namespace: flowcartographer
  labels:
    app.kubernetes.io/name: flowcartographer-aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowcartographer-aggregator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowcartographer-aggregator
    spec:
      serviceAccountName: flowcartographer-aggregator
      containers:
        - name: aggregator
          image: flowcartographer/aggregator:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flowcartographer-aggregator
  namespace: flowcartographer
  labels:
    app.kubernetes.io/name: flowcartographer-aggregator
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: flowcartographer-aggregator
