agent:
  image:
    repository: flowcartographer/agent
    tag: v1.0.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 20m
      memory: 32Mi
  batchSize: 500
  batchIntervalMs: 500
  enableDnsCapture: true
  enableProcessTrace: true

aggregator:
  replicaCount: 1
  image:
    repository: flowcartographer/aggregator
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    size: 10Gi
