apiVersion: v1
kind: ServiceAccount
metadata:
  name: flowcartographer-agent
  namespace: flowcartographer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flowcartographer-aggregator
  namespace: flowcartographer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flowcartographer-agent
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - statefulsets
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flowcartographer-agent
subjects:
  - kind: ServiceAccount
    name: flowcartographer-agent
    namespace: flowcartographer
roleRef:
  kind: ClusterRole
  name: flowcartographer-agent
  apiGroup: rbac.authorization.k8s.io
